name: Simulation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -V 2>&1 | head -n 1

      - name: Compile
        run: iverilog -o sim Controller.v Scheduler.v Master.v Slave.v Testbench.v

      - name: Run testbench
        run: timeout 300 vvp -n sim | tee sim.log

      - name: Check results
        run: |
          ok=$(grep -c "OK\]" sim.log || true)
          errors=$(grep -c "ERROR\]" sim.log || true)

          {
            echo "## Simulation results"
            echo ""
            echo "| Passed checks | Failed checks |"
            echo "|---|---|"
            echo "| $ok | $errors |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$errors" -ne 0 ]; then
            echo "::error::$errors check(s) failed:"
            grep "ERROR\]" sim.log
            exit 1
          fi
          if ! grep -q "FIFO is empty!" sim.log; then
            echo "::error::Testbench did not run to completion"
            exit 1
          fi
          if [ "$ok" -eq 0 ]; then
            echo "::error::No checks ran"
            exit 1
          fi
          echo "All $ok checks passed."

      - name: Upload simulation log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: simulation-log
          path: sim.log
